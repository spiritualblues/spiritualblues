defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

  - scope:
      path: "" # applies to all files
      type: "pages"
    values:
      classes: wide
  - scope:
      path: "" # applies to all posts
      type: "posts"
    values:
      classes: wide
  - scope:
      path: "" # applies to any relevant collection, e.g., "docs"
      type: "docs"
    values:
      classes: wide


tag_archive:
  type: liquid
  path: /tags/

# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: spiritual blues
email: spiri@mail.com
description: >-
  Write an awesome description for your new site here...
twitter_username: spiritualblues
github_username: spiritualblues
url: "https://spi.blue"
baseurl: ""
minimal_mistakes_skin: air
search: true

timezone: "America/New_York"

markdown: kramdown
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
permalink: /:year/:month/:day/:title/
paginate: 5
paginate_path: /page:num/

include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-seo-tag

author:
 # name: "spiritual blues"
 bio: "perpetually rooting for the underdog"

footer:
  links:
 #   - label: "Twitter"
 #     icon: "fab fa-fw fa-twitter-square"
 #     url: "https://twitter.com/spiritualblues"
#   - label: "BlueSky"
 #     icon: "fab fa-brands fa-square-bluesky"
  #    url: "https://bsky.app/profile/spi.blue"
  #  - label: "GitHub"
 #     icon: "fab fa-fw fa-github"
  #    url: "https://github.com/spiritualblues"
  #  - label: "Instagram"
 #     icon: "fab fa-fw fa-instagram"
  #    url: "https://instagram.com/"


defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: true
      comments: false
      share: false
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false


tag_archive:
  type: liquid
  path: /tags/
